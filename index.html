  <style>
    /* ==========================================================================
       ENTERPRISE DESIGN SYSTEM: TOKENS & CSS VARIABLES
       ========================================================================== */
    :root {
      --bg-base: #05070d;
      --bg-surface-1: #0b1120;
      --bg-surface-2: #111a30;
      --bg-glass: rgba(15, 23, 42, 0.72);
      --bg-glass-hover: rgba(30, 41, 59, 0.85);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --border-glow-cyan: rgba(6, 182, 212, 0.4);
      --border-glow-blue: rgba(59, 130, 246, 0.4);
      
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --cyan-400: #22d3ee;
      --cyan-500: #06b6d4;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --indigo-500: #6366f1;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --rose-500: #f43f5e;
      
      --grad-cyan-blue: linear-gradient(135deg, #38bdf8 0%, #2563eb 50%, #6366f1 100%);
      --grad-emerald-cyan: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --grad-amber-rose: linear-gradient(135deg, #f59e0b 0%, #f43f5e 100%);
      --grad-card-dark: linear-gradient(180deg, rgba(17, 26, 48, 0.75) 0%, rgba(9, 14, 28, 0.9) 100%);
      
      --glow-blue: 0 0 45px rgba(37, 99, 235, 0.28);
      --glow-cyan: 0 0 45px rgba(6, 182, 212, 0.32);
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-xl: 30px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    #neural-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    .app-root {
      position: relative;
      z-index: 1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    ::selection {
      background: rgba(56, 189, 248, 0.35);
      color: #ffffff;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #060911;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .gradient-text {
      background: var(--grad-cyan-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .gradient-emerald {
      background: var(--grad-emerald-cyan);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .section-header {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 60px auto;
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--cyan-400);
      box-shadow: 0 0 10px var(--cyan-400);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .section-title {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .section-desc {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .btn-primary {
      padding: 12px 26px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-full);
      background: var(--grad-cyan-blue);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 22px rgba(37, 99, 235, 0.45);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.65);
    }

    .btn-secondary {
      padding: 10px 20px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    /* Topbar Navigation */
    .topbar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 20px;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(8, 14, 28, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      background: var(--grad-cyan-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s ease;
      position: relative;
      padding: 6px 0;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--grad-cyan-blue);
      border-radius: 2px;
    }

    /* Hero Section */
    .hero-section {
      padding: 175px 0 90px 0;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 52px;
      align-items: center;
    }

    .hero-content h1 {
      font-size: clamp(42px, 5.2vw, 70px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }

    .hero-subtitle {
      font-size: 19px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 38px;
      max-width: 620px;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 48px;
    }

    .hero-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding-top: 32px;
      border-top: 1px solid var(--border-subtle);
    }

    .hero-stat-item strong {
      display: block;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--grad-cyan-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-mono);
    }

    .hero-stat-item span {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.4;
      display: block;
      margin-top: 4px;
    }

    /* Command Center Card */
    .command-center-card {
      background: var(--grad-card-dark);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), var(--glow-blue);
      position: relative;
      overflow: hidden;
    }

    .command-center-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--grad-cyan-blue);
    }

    .cc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }
    .window-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .window-dot.red { background: #ef4444; }
    .window-dot.yellow { background: #f59e0b; }
    .window-dot.green { background: #10b981; }

    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-family: var(--font-mono);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 5px 12px;
      border-radius: var(--radius-full);
    }

    .live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulseGlow 1.5s infinite;
    }

    .cc-nodes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cc-node-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      font-size: 13px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .cc-node-row:hover, .cc-node-row.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .cc-node-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cc-node-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(37, 99, 235, 0.18);
      color: var(--cyan-400);
    }

    .cc-node-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--cyan-400);
      font-weight: 700;
    }

    .terminal-box {
      background: #03060f;
      border-radius: var(--radius-sm);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
      line-height: 1.65;
    }
    .terminal-box .prompt { color: #38bdf8; }
    .terminal-box .success { color: #34d399; }
    .terminal-box .cyan { color: #22d3ee; }

    /* Trust Section */
    .trust-section {
      padding: 36px 0 80px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .trust-label {
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 28px;
    }
    .trust-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 32px 52px;
    }
    .trust-badge-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 14.5px;
      font-weight: 600;
      opacity: 0.85;
      transition: all 0.25s ease;
    }
    .trust-badge-item:hover {
      opacity: 1;
      color: #ffffff;
      transform: translateY(-2px);
    }
    .trust-badge-item svg {
      width: 24px;
      height: 24px;
      color: var(--cyan-400);
    }

    /* Benchmarks Section */
    .benchmarks-section {
      padding: 110px 0;
      position: relative;
    }
    .benchmarks-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-bottom: 40px;
    }
    .benchmark-card {
      background: var(--grad-card-dark);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .benchmark-card:hover {
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-5px);
      box-shadow: var(--glow-blue);
    }
    .benchmark-metric-big {
      font-size: 54px;
      font-weight: 900;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 14px;
      background: var(--grad-cyan-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .benchmark-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .benchmark-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 24px;
    }
    .benchmark-recovery-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: var(--text-muted);
    }
    .benchmark-recovery-pill strong {
      color: var(--cyan-400);
      font-family: var(--font-mono);
    }

    /* Capabilities Matrix */
    .capabilities-section {
      padding: 110px 0;
      background: linear-gradient(180deg, transparent 0%, rgba(11, 17, 32, 0.5) 50%, transparent 100%);
    }
    .tab-pills-nav {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }
    .tab-pill-btn {
      padding: 13px 26px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      font-size: 14.5px;
      font-weight: 700;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tab-pill-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
    }
    .tab-pill-btn.active {
      background: rgba(37, 99, 235, 0.25);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .capability-pane {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
      animation: tabFadeIn 0.35s ease;
    }
    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cap-features-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 24px 0 36px 0;
    }
    .cap-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      font-size: 15px;
      color: #e2e8f0;
    }
    .cap-check-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 800;
    }
    .cap-card-visual {
      background: #080c18;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }
    .telemetry-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }
    .telemetry-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 18px;
      border-radius: var(--radius-md);
    }
    .telemetry-box strong {
      display: block;
      font-size: 26px;
      color: var(--cyan-400);
      font-family: var(--font-mono);
      margin-bottom: 4px;
    }
    .telemetry-box span {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    /* Calculator Section */
    .calculator-section {
      padding: 110px 0;
      position: relative;
    }
    .calc-card-container {
      background: var(--grad-card-dark);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: var(--radius-xl);
      padding: 52px;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), var(--glow-cyan);
    }
    .calc-layout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .calc-slider-wrapper {
      margin: 32px 0;
    }
    .calc-slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

    // --------------------------------------------------------------------------

    function FinOpsCalculator() {
      const [spend, setSpend] = useState(60000);
      const [workload, setWorkload] = useState('k8s');

      const calculations = useMemo(() => {
        const multiplier = workload === 'ai' ? 0.46 : workload === 'k8s' ? 0.418 : 0.38;
        const annual = Math.round(spend * 12 * multiplier);
        const idle = Math.round(spend * 0.17);
        const spot = Math.round(spend * (multiplier - 0.17));
        const hours = Math.round((spend / 1000) * 12.8);
        return { annual, idle, spot, hours, percent: (multiplier * 100).toFixed(1) };
      }, [spend, workload]);

      return (
        <section className="calculator-section" id="calculator">
          <div className="container">
            <div className="calc-card-container">

                <div>

  <!-- Neural Constellation Canvas Animation Engine -->
  <script>
    (function () {
      const canvas = document.getElementById('neural-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      let mouse = { x: null, y: null, radius: 150 };

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.45;
          this.vy = (Math.random() - 0.5) * 0.45;
          this.radius = Math.random() * 1.8 + 0.8;
          this.baseColor = Math.random() > 0.4 ? 'rgba(56, 189, 248, ' : 'rgba(99, 102, 241, ';
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > width) this.vx = -this.vx;
          if (this.y < 0 || this.y > height) this.vy = -this.vy;

          if (mouse.x !== null && mouse.y !== null) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              this.x -= (dx / dist) * force * 2.5;
              this.y -= (dy / dist) * force * 2.5;
            }
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.baseColor + '0.7)';
          ctx.fill();
        }
      }

      const particleCount = Math.min(Math.floor((window.innerWidth * window.innerHeight) / 16000), 90);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();

          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              const alpha = (1 - dist / 130) * 0.22;
              ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
