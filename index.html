              <div className="case-stories-list">
                <div className="case-story-block">
                  <div>
                    <span style={{ fontSize: '12.5px', fontFamily: 'var(--font-mono)', color: 'var(--accent-cyan)', fontWeight: 700 }}>
                      FINANCIAL SERVICES
                    </span>
                    <h4 style={{ marginTop: '6px' }}>Re-architecting a Multi-Region Banking Core</h4>
                    <p>
                      A growing fintech was struggling with Kubernetes cluster drift and strict PCI-DSS audit deadlines. We migrated 340+ microservices to automated multi-region EKS with Cilium eBPF encryption, achieving zero downtime cutover.
                    </p>
                  </div>
                  <div className="case-impact-column">
                    <span className="kpi-big">44.2%</span>
                    <span className="kpi-label">Reduction in annual cloud infrastructure spend with 99.999% uptime</span>
                  </div>
                </div>

                <div className="case-story-block">
                  <div>
                    <span style={{ fontSize: '12.5px', fontFamily: 'var(--font-mono)', color: 'var(--accent-cyan)', fontWeight: 700 }}>
                      BIOMEDICAL AI PLATFORM
                    </span>
                    <h4 style={{ marginTop: '6px' }}>Scaling LLM Inference from 140ms to 18ms</h4>
                    <p>
                      A healthtech genomics startup faced massive GPU memory starvation under concurrent hospital API queries. We restructured their serving pipeline with vLLM and dynamic GPU slicing (MIG) on spot fleets.
                    </p>
                  </div>
                  <div className="case-impact-column">
                    <span className="kpi-big">7.8x</span>
                    <span className="kpi-label">Higher concurrent query throughput per GPU instance</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Direct Consultation / Contact */}
          <section className="editorial-section" id="contact" style={{ borderBottom: 'none' }}>
            <div className="container">
              <div className="contact-block">
                <div className="contact-grid">
                  <div className="contact-left">
                    <h3>Let's talk about your infrastructure.</h3>
                    <p>
                      No salespeople. You'll speak directly with a principal cloud architect about your architecture, current pain points, and realistic timelines.
                    </p>
                    
                    <div style={{ marginBottom: '16px' }}>
                      <span style={{ fontSize: '12.5px', color: 'var(--text-dim)', display: 'block', marginBottom: '4px' }}>DIRECT INBOX</span>
                      <a href="mailto:hello@cloudspecialist.work" className="direct-email-box">
                        hello@cloudspecialist.work
                      </a>
                    </div>

                    <div style={{ fontSize: '14px', color: 'var(--text-muted)', lineHeight: 1.6 }}>
                      🔒 Full NDA confidentiality guaranteed on all initial discussions.
                    </div>
                  </div>

                  <form onSubmit={handleContact}>
                    <div className="form-group-humane">
                      <label>Your Name</label>
                      <input 
                        type="text" 
                        className="form-input-humane" 
                        placeholder="e.g. Alex Morgan"
                        required
                        value={form.name}
                        onChange={(e) => setForm({...form, name: e.target.value})}
                      />
                    </div>

                    <div className="form-group-humane">
                      <label>Work Email</label>
                      <input 
                        type="email" 
                        className="form-input-humane" 
                        placeholder="alex@company.com"
                        required
                        value={form.email}
                        onChange={(e) => setForm({...form, email: e.target.value})}
                      />
                    </div>

                    <div className="form-group-humane">
                      <label>Primary Cloud Provider</label>
                      <select 
                        className="form-select-humane"
                        value={form.environment}
                        onChange={(e) => setForm({...form, environment: e.target.value})}
                      >
                        <option value="AWS">AWS</option>
                        <option value="Azure">Microsoft Azure</option>
                        <option value="GCP">Google Cloud Platform</option>
                        <option value="Multi-Cloud / Hybrid">Multi-Cloud / Hybrid</option>
                      </select>
                    </div>

                    <div className="form-group-humane">
                      <label>What's the main challenge you're looking to solve?</label>
                      <textarea 
                        className="form-textarea-humane" 
                        placeholder="e.g. Cloud spend grew unexpectedly, need to scale an AI inference cluster, or planning a Kubernetes migration..."
                        value={form.context}
                        onChange={(e) => setForm({...form, context: e.target.value})}
                      ></textarea>
                    </div>

                    <button type="submit" className="btn-submit-humane">
                      Send to Principal Architect →
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="footer">
            <div className="container">
              <div className="footer-flex">
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <img src="logo.png" alt="Logo" style={{ width: '26px', height: '26px', borderRadius: '6px' }}/>
                  <span style={{ fontWeight: 700, color: '#ffffff' }}>CloudSpecialist AI</span>
                  <span style={{ color: 'var(--text-dim)' }}>— Hands-on Cloud & Platform Engineering</span>
                </div>

                <div>
                  <a href="mailto:hello@cloudspecialist.work" style={{ color: 'var(--accent-cyan)', fontFamily: 'var(--font-mono)' }}>
                    hello@cloudspecialist.work
                  </a>
                </div>
              </div>
            </div>
          </footer>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</body>
