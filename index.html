Work Email: ${formData.email}
Primary Environment: ${formData.environment}
Monthly Spend Tier: ${formData.spendTier}
Engagement Scope: ${formData.scope}

Project Requirements:
${formData.notes}`;

                  <li className="nav-item"><a href="#case-studies">Case Studies</a></li>
                </ul>

                  Scope Engagement

            </div>
          </header>
